version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: constellation_prometheus
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.0.0
    container_name: constellation_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./configs/grafana_dashboard.json:/var/lib/grafana/dashboards/dashboard.json