services:
  # Your Custom Python Application (Fast/Slow Loop + Metrics Exporter)
  app:
    build: .
    container_name: constellation_app
    ports:
      - "8000:8000"   # Fast loop / MAPPO & telemetry metrics
      - "8001:8001"   # Slow loop / MCP metrics
      - "8080:8080"   # FastMCP HTTP server
    environment:
      - PYTHONUNBUFFERED=1
    restart: always
    networks:
      - constellation-net

  # Prometheus Infrastructure
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: constellation_prometheus
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - app
    networks:
      - constellation-net
    

  # Grafana Dashboard Infrastructure
  grafana:
    image: grafana/grafana:10.0.0
    container_name: constellation_grafana
    ports:
      - "4000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./configs/grafana_dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
    depends_on:
      - prometheus
    networks:
      - constellation-net

volumes:
  grafana-data:


networks:
  constellation-net:
    external: true

  