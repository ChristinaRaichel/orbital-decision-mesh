global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "constellation_fast_loop"
    static_configs:
      - targets: ["constellation_app:8000"]

  - job_name: "constellation_slow_loop"
    static_configs:
      - targets: ["host.docker.internal:8001"] # Use host.docker.internal if slow_loop runs on your host machine