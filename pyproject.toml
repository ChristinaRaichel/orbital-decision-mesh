[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "orbital-decision-mesh"
version = "0.1.0"
description = "Real-time LEO constellation beam-hopping simulation platform utilizing MAPPO and FastMCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Principal MLE / Systems Architect" }
]
dependencies = [
    "requests>=2.28.0",
    "torch>=2.0.0",
    "gymnasium>=0.29.0",
    "fastmcp>=0.1.0",
    "evidently>=0.4.0",
    "prometheus-client>=0.16.0",
    "skyfield>=1.45",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib",
    "seaborn"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]